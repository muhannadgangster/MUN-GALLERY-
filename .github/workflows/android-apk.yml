name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (requires release tag)'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag name (e.g., v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Prepare Secrets Configuration
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Build Debug APK
        run: |
          echo "Building Debug APK..."
          ./gradlew assembleDebug --stacktrace

      - name: Verify Debug APK Output
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$DEBUG_APK" ]; then
            echo "SUCCESS: Debug APK found at $DEBUG_APK"
            mkdir -p dist
            cp "$DEBUG_APK" dist/MUN-Gallery-debug.apk
          else
            echo "ERROR: Debug APK was not generated!"
            exit 1
          fi

      - name: Configure Release Signing & Build Release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/release-upload.jks"
          
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Found RELEASE_KEYSTORE_BASE64 secret. Decoding production keystore..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASS="$STORE_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
            IS_PRODUCTION_SIGNED=true
          else
            echo "No production keystore secret configured. Creating CI upload keystore..."
            STORE_PASS="android_ci_keystore_pass"
            KEY_PASS="android_ci_keystore_pass"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=M-U-N Gallery, OU=Release, O=M-U-N, L=Global, ST=Android, C=US"
            IS_PRODUCTION_SIGNED=false
          fi

          echo "Building Release APK..."
          KEYSTORE_PATH="$KEYSTORE_FILE" \
          STORE_PASSWORD="$STORE_PASS" \
          KEY_PASSWORD="$KEY_PASS" \
          ./gradlew assembleRelease --stacktrace

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$RELEASE_APK" ]; then
            echo "SUCCESS: Release APK found at $RELEASE_APK"
            mkdir -p dist
            if [ "$IS_PRODUCTION_SIGNED" = true ]; then
              cp "$RELEASE_APK" dist/MUN-Gallery-release.apk
            else
              cp "$RELEASE_APK" dist/MUN-Gallery-release.apk
            fi
          else
            echo "ERROR: Release APK was not generated!"
            exit 1
          fi

      - name: Compute Checksums
        run: |
          cd dist
          echo "### SHA-256 Checksums"
          sha256sum *.apk | tee checksums.txt

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mun-gallery-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Eligibility
        id: release_check
        run: |
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/v') }}"
          MANUAL_RELEASE="${{ github.event.inputs.create_release == 'true' }}"
          
          if [ "$IS_TAG" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          elif [ "$MANUAL_RELEASE" = "true" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        if: steps:release_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_check.outputs.tag_name }}
          name: "M-U-N Gallery ${{ steps.release_check.outputs.tag_name }}"
          body: |
            ## M-U-N Gallery — Your Moments, Beautifully.

            ### What's in this Release:
            - **Native Android APKs** built with Kotlin, Jetpack Compose, and modern Android MediaStore.
            - **Liquid Glass Design:** Dark translucent cards, dynamic blur, and customizable neon refractions.
            - **Local Media Support:** Access real device photos, videos, and albums without cloud lock-in.
            - **Built-in Photo Editor:** Rotate, flip, crop, and adjust brightness/contrast/saturation/warmth.
            - **Offline-First:** All moments stay private on your device.

            ### Download & Installation:
            1. Download `MUN-Gallery-release.apk` (or `MUN-Gallery-debug.apk`) below directly to your Android device.
            2. Open the downloaded file to install.
            3. If prompted by Android, enable **Install unknown apps** for your browser or file manager.
            4. Launch **M-U-N Gallery** and grant gallery permissions to display your moments.

            ### Verify Integrity (SHA-256 Checksums):
            ```
            $(cat dist/checksums.txt)
            ```
          files: |
            dist/MUN-Gallery-release.apk
            dist/MUN-Gallery-debug.apk
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
